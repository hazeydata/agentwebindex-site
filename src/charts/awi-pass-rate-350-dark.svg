    <text style="font-size: 8.5px; font-family: 'Inter', sans-serif; fill: #e6edf5" transform="translate(179.424 241.343457)">79 of 120 tested</text>
    <text style="font-size: 8.5px; font-family: 'Inter', sans-serif; fill: #e6edf5" transform="translate(179.424 251.628125)">(66%)</text>
   </g>
  </g>
  <g id="text_10">
   <text style="font-size: 8.5px; font-family: 'Inter', sans-serif; fill: #8796a8" transform="translate(10.08 19.034375)">Pass rate on our test set (passed / attempted), with</text>
   <text style="font-size: 8.5px; font-family: 'Inter', sans-serif; fill: #8796a8" transform="translate(10.08 29.319043)">95% intervals. One run, 2026-10-23. Search and</text>
   <text style="font-size: 8.5px; font-family: 'Inter', sans-serif; fill: #8796a8" transform="translate(10.08 39.603711)">scrape are different jobs; compare within a panel. A</text>
   <text style="font-size: 8.5px; font-family: 'Inter', sans-serif; fill: #8796a8" transform="translate(10.08 49.888379)">search pass = the expected URL in the top 10, the</text>
   <text style="font-size: 8.5px; font-family: 'Inter', sans-serif; fill: #8796a8" transform="translate(10.08 60.173047)">expected domain in the top 5, or the expected text</text>
   <text style="font-size: 8.5px; font-family: 'Inter', sans-serif; fill: #8796a8" transform="translate(10.08 70.457715)">in a top-5 result.</text>
  </g>
  <g id="text_11">
   <text style="font-weight: 600; font-size: 8.5px; font-family: 'Inter', sans-serif; text-anchor: start; fill: #e6edf5" x="10.08" y="105.782041" transform="rotate(-0 10.08 105.782041)">Search APIs · 100 evergreen questions</text>
  </g>
  <g id="text_12">
   <text style="font-size: 8px; font-family: 'Inter', sans-serif; fill: #8796a8" transform="translate(10.08 171.202812)">Not tested: Brave (terms forbid benchmarking),</text>
   <text style="font-size: 8px; font-family: 'Inter', sans-serif; fill: #8796a8" transform="translate(10.08 183.049062)">Linkup (not in month 1), Parallel (not in month 1),</text>
   <text style="font-size: 8px; font-family: 'Inter', sans-serif; fill: #8796a8" transform="translate(10.08 194.664687)">Serper (not in month 1)</text>
  </g>
  <g id="text_13">
   <text style="font-weight: 600; font-size: 8.5px; font-family: 'Inter', sans-serif; text-anchor: start; fill: #e6edf5" x="10.08" y="223.445791" transform="rotate(-0 10.08 223.445791)">Scrape APIs · URL set</text>
  </g>
  <g id="text_14">
   <text style="font-size: 8px; font-family: 'Inter', sans-serif; fill: #8796a8" transform="translate(10.08 293.953438)">30 skipped under Browserless's terms (anti-bot URLs;</text>
   <text style="font-size: 8px; font-family: 'Inter', sans-serif; fill: #8796a8" transform="translate(10.08 305.569063)">skips, not failures). Not tested: Exa (not built),</text>
   <text style="font-size: 8px; font-family: 'Inter', sans-serif; fill: #8796a8" transform="translate(10.08 317.352813)">Parallel (not in month 1), Firecrawl (no key), Jina</text>
   <text style="font-size: 8px; font-family: 'Inter', sans-serif; fill: #8796a8" transform="translate(10.08 328.968438)">(not in month 1), Apify (not built), Hyperbrowser</text>
   <text style="font-size: 8px; font-family: 'Inter', sans-serif; fill: #8796a8" transform="translate(10.08 340.552813)">(not in month 1), ScrapingBee (not in month 1),</text>
   <text style="font-size: 8px; font-family: 'Inter', sans-serif; fill: #8796a8" transform="translate(10.08 351.984688)">Bright Data (not run yet)</text>
  </g>
  <g id="text_15">
   <text style="font-weight: 600; font-size: 8.5px; font-family: 'Inter', sans-serif; text-anchor: start; fill: #e6edf5" x="10.08" y="378.853291" transform="rotate(-0 10.08 378.853291)">Browser APIs</text>
  </g>
  <g id="text_16">
   <text style="font-size: 8px; font-family: 'Inter', sans-serif; fill: #8796a8" transform="translate(10.08 404.725313)">No browser run on Oct 23: the browser-task set file</text>
   <text style="font-size: 8px; font-family: 'Inter', sans-serif; fill: #8796a8" transform="translate(10.08 415.487188)">was missing at run time. Not tested: Hyperbrowser</text>
   <text style="font-size: 8px; font-family: 'Inter', sans-serif; fill: #8796a8" transform="translate(10.08 427.530938)">(not in month 1), Browserbase (not in month 1),</text>
   <text style="font-size: 8px; font-family: 'Inter', sans-serif; fill: #8796a8" transform="translate(10.08 439.302813)">Steel (not in month 1)</text>
  </g>
  <g id="text_17">
   <text style="font-size: 8px; font-family: 'Inter', sans-serif; fill: #8796a8" transform="translate(10.08 471.273242)">Denominator = queries or URLs we graded: excludes</text>
   <text style="font-size: 8px; font-family: 'Inter', sans-serif; fill: #8796a8" transform="translate(10.08 483.502227)">ToS skips and HTTP 429 rate-limit replies (none</text>
   <text style="font-size: 8px; font-family: 'Inter', sans-serif; fill: #8796a8" transform="translate(10.08 495.738711)">logged on Oct 23). Search graded with</text>
   <text style="font-size: 8px; font-family: 'Inter', sans-serif; fill: #8796a8" transform="translate(10.08 507.61332)">canon-2026-10-20; scrape pass/fail from the run log</text>
   <text style="font-size: 8px; font-family: 'Inter', sans-serif; fill: #8796a8" transform="translate(10.08 519.75418)">(grader 'run-log'). Scrape set: 150 URLs;</text>
   <text style="font-size: 8px; font-family: 'Inter', sans-serif; fill: #8796a8" transform="translate(10.08 531.974414)">Browserless's terms forbid the 30 anti-bot ones, so</text>
   <text style="font-size: 8px; font-family: 'Inter', sans-serif; fill: #8796a8" transform="translate(10.08 543.959023)">120 were tested. No row is mock or partial. Left out</text>
   <text style="font-size: 8px; font-family: 'Inter', sans-serif; fill: #8796a8" transform="translate(10.08 556.099883)">on purpose: the short news weeks 42 and 43 (n=16 and</text>
   <text style="font-size: 8px; font-family: 'Inter', sans-serif; fill: #8796a8" transform="translate(10.08 568.152617)">40, flagged), Apify (news weeks only) and</text>
   <text style="font-size: 8px; font-family: 'Inter', sans-serif; fill: #8796a8" transform="translate(10.08 580.570352)">Browserless browser (no Oct 23 run).</text>
   <text style="font-size: 8px; font-family: 'Inter', sans-serif; fill: #8796a8" transform="translate(10.08 592.310586)">Source: hazeydata/agentwebindex</text>
   <text style="font-size: 8px; font-family: 'Inter', sans-serif; fill: #8796a8" transform="translate(10.08 604.45707)">data/benchmarks/latest.json @ 303efdf</text>
  </g>
 </g>
