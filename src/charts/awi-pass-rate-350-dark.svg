  <g id="text_11">
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #8796a8" transform="translate(10.08 64.383125)">Pass rate on our test set (passed / attempted), with</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #8796a8" transform="translate(10.08 74.667793)">95% intervals. One run, Oct 23, 2026. Search and</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #8796a8" transform="translate(10.08 84.952461)">scrape are different jobs; compare within a panel. A</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #8796a8" transform="translate(10.08 95.237129)">search pass = the expected URL in the top 10, the</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #8796a8" transform="translate(10.08 105.521797)">expected domain in the top 5, or the expected text</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #8796a8" transform="translate(10.08 115.806465)">in a top-5 result.</text>
  </g>
  <g id="text_12">
   <text style="font-weight: 600; font-size: 8.75px; font-family: 'Inter', sans-serif; text-anchor: start; fill: #e6edf5" x="10.08" y="151.130791" transform="rotate(-0 10.08 151.130791)">Search APIs · 100 evergreen questions</text>
  </g>
  <g id="text_13">
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #8796a8" transform="translate(10.08 217.652588)">Not tested: Brave (terms forbid</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #8796a8" transform="translate(10.08 230.009229)">benchmarking), Linkup (not in month</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #8796a8" transform="translate(10.08 242.966064)">1), Parallel (not in month 1), Serper</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #8796a8" transform="translate(10.08 255.967334)">(not in month 1)</text>
  </g>
  <g id="text_14">
   <text style="font-weight: 600; font-size: 8.75px; font-family: 'Inter', sans-serif; text-anchor: start; fill: #e6edf5" x="10.08" y="275.105791" transform="rotate(-0 10.08 275.105791)">Scrape APIs · URL set</text>
  </g>
  <g id="text_15">
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #8796a8" transform="translate(10.08 346.370908)">30 ToS skips on anti-bot URLs (skips,</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #8796a8" transform="translate(10.08 359.024229)">not failures; not graded). Not tested:</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #8796a8" transform="translate(10.08 371.905869)">Exa (not built), Parallel (not in</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #8796a8" transform="translate(10.08 384.668564)">month 1), Firecrawl (no key), Jina</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #8796a8" transform="translate(10.08 397.373154)">(not in month 1), Apify (not built),</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #8796a8" transform="translate(10.08 410.077744)">Hyperbrowser (not in month 1),</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #8796a8" transform="translate(10.08 422.748154)">ScrapingBee (not in month 1), Bright</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #8796a8" transform="translate(10.08 435.285947)">Data (not run yet)</text>
  </g>
  <g id="text_16">
   <text style="font-weight: 600; font-size: 8.75px; font-family: 'Inter', sans-serif; text-anchor: start; fill: #e6edf5" x="10.08" y="443.135791" transform="rotate(-0 10.08 443.135791)">Browser APIs</text>
  </g>
  <g id="text_17">
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #8796a8" transform="translate(10.08 469.014932)">No browser run on Oct 23, 2026: the</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #8796a8" transform="translate(10.08 481.649111)">browser-task set file was missing at</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #8796a8" transform="translate(10.08 494.342764)">run time. Not tested: Hyperbrowser</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #8796a8" transform="translate(10.08 507.481436)">(not in month 1), Browserbase (not in</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #8796a8" transform="translate(10.08 520.186025)">month 1), Steel (not in month 1)</text>
  </g>
  <g id="text_18">
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #8796a8" transform="translate(10.08 465.509357)">Denominator = queries or URLs we</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #8796a8" transform="translate(10.08 478.692035)">graded: excludes ToS skips and HTTP</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #8796a8" transform="translate(10.08 492.016217)">429 rate-limit replies (none logged on</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #8796a8" transform="translate(10.08 505.451141)">Oct 23, 2026). Search graded with</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #8796a8" transform="translate(10.08 518.490265)">canon-2026-10-20; scrape pass/fail</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #8796a8" transform="translate(10.08 531.71806)">from the run log (grader 'run-log').</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #8796a8" transform="translate(10.08 544.85152)">Scrape set: 150 URLs; Browserless's</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #8796a8" transform="translate(10.08 558.317889)">terms forbid the 30 anti-bot ones, so</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #8796a8" transform="translate(10.08 572.222443)">120 were tested. No row is mock or</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #8796a8" transform="translate(10.08 584.563617)">partial. Rankings are the Oct 23, 2026</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #8796a8" transform="translate(10.08 597.893951)">run. Left out on purpose: the short</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #8796a8" transform="translate(10.08 611.298798)">news weeks 42/43/46 (n=16, 40, 24;</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #8796a8" transform="translate(10.08 624.442511)">week 46 is a short week, below the</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #8796a8" transform="translate(10.08 637.824799)">minimum at n=24), TinyFish's week</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #8796a8" transform="translate(10.08 650.812653)">45/46 news and newsfetch rows, Apify</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #8796a8" transform="translate(10.08 664.091718)">(news weeks only; paid-tier price not</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #8796a8" transform="translate(10.08 677.342755)">captured) and Browserless browser (no</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #8796a8" transform="translate(10.08 690.702484)">Oct 23, 2026 browser-task run).</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #8796a8" transform="translate(10.08 703.703326)">TinyFish is a priced provider</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #8796a8" transform="translate(10.08 717.298895)">(TinySearch/TinyFetch free, $0.00 per</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #8796a8" transform="translate(10.08 730.278546)">request) with no Oct 23, 2026 rows, so</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #8796a8" transform="translate(10.08 743.42226)">it is not plotted.</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #8796a8" transform="translate(10.08 756.650055)">Source: hazeydata/agentwebindex</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #8796a8" transform="translate(10.08 769.935272)">data/benchmarks/latest.json @ c352ff1</text>
  </g>
