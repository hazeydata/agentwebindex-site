  <g id="text_11">
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #8796a8" transform="translate(10.08 64.383125)">Pass rate on our test set (passed / attempted), with</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #8796a8" transform="translate(10.08 74.667793)">95% intervals. One run, Oct 23, 2026. Search and</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #8796a8" transform="translate(10.08 84.952461)">scrape are different jobs; compare within a panel. A</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #8796a8" transform="translate(10.08 95.237129)">search pass = the expected URL in the top 10, the</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #8796a8" transform="translate(10.08 105.521797)">expected domain in the top 5, or the expected text</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #8796a8" transform="translate(10.08 115.806465)">in a top-5 result.</text>
  </g>
  <g id="text_12">
   <text style="font-weight: 600; font-size: 8.75px; font-family: 'Inter', sans-serif; text-anchor: start; fill: #e6edf5" x="10.08" y="151.130791" transform="rotate(-0 10.08 151.130791)">Search APIs · 100 evergreen questions</text>
  </g>
  <g id="text_13">
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #8796a8" transform="translate(10.08 217.652588)">Not tested: Brave (terms forbid</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #8796a8" transform="translate(10.08 230.009229)">benchmarking), Linkup (not in month</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #8796a8" transform="translate(10.08 242.966064)">1), Parallel (not in month 1), Serper</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #8796a8" transform="translate(10.08 255.967334)">(not in month 1)</text>
  </g>
  <g id="text_14">
   <text style="font-weight: 600; font-size: 8.75px; font-family: 'Inter', sans-serif; text-anchor: start; fill: #e6edf5" x="10.08" y="314.615791" transform="rotate(-0 10.08 314.615791)">Scrape APIs · URL set</text>
  </g>
  <g id="text_15">
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #8796a8" transform="translate(10.08 385.880908)">30 ToS skips on anti-bot URLs (skips,</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #8796a8" transform="translate(10.08 398.534229)">not failures; not graded). Not tested:</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #8796a8" transform="translate(10.08 411.415869)">Exa (not built), Parallel (not in</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #8796a8" transform="translate(10.08 424.178564)">month 1), Firecrawl (no key), Jina</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #8796a8" transform="translate(10.08 436.883154)">(not in month 1), Apify (not built),</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #8796a8" transform="translate(10.08 449.587744)">Hyperbrowser (not in month 1),</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #8796a8" transform="translate(10.08 462.258154)">ScrapingBee (not in month 1), Bright</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #8796a8" transform="translate(10.08 474.795947)">Data (not run yet)</text>
  </g>
  <g id="text_16">
   <text style="font-weight: 600; font-size: 8.75px; font-family: 'Inter', sans-serif; text-anchor: start; fill: #e6edf5" x="10.08" y="545.105791" transform="rotate(-0 10.08 545.105791)">Browser APIs</text>
  </g>
  <g id="text_17">
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #8796a8" transform="translate(10.08 570.984932)">No browser run on Oct 23, 2026: the</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #8796a8" transform="translate(10.08 583.619111)">browser-task set file was missing at</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #8796a8" transform="translate(10.08 596.312764)">run time. Not tested: Hyperbrowser</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #8796a8" transform="translate(10.08 609.451436)">(not in month 1), Browserbase (not in</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #8796a8" transform="translate(10.08 622.156025)">month 1), Steel (not in month 1)</text>
  </g>
  <g id="text_18">
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #8796a8" transform="translate(10.08 767.616857)">Denominator = queries or URLs we</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #8796a8" transform="translate(10.08 780.799535)">graded: excludes ToS skips and HTTP</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #8796a8" transform="translate(10.08 794.123717)">429 rate-limit replies (none logged on</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #8796a8" transform="translate(10.08 807.558641)">Oct 23, 2026). Search graded with</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #8796a8" transform="translate(10.08 820.597765)">canon-2026-10-20; scrape pass/fail</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #8796a8" transform="translate(10.08 833.82556)">from the run log (grader 'run-log').</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #8796a8" transform="translate(10.08 846.95902)">Scrape set: 150 URLs; Browserless's</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #8796a8" transform="translate(10.08 860.425389)">terms forbid the 30 anti-bot ones, so</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #8796a8" transform="translate(10.08 874.329943)">120 were tested. No row is mock or</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #8796a8" transform="translate(10.08 886.671117)">partial. Rankings are the Oct 23, 2026</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #8796a8" transform="translate(10.08 900.001451)">run. Left out on purpose: the short</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #8796a8" transform="translate(10.08 913.406298)">news weeks 42/43/46 (n=16, 40, 24;</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #8796a8" transform="translate(10.08 926.550011)">week 46 is a short week, below the</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #8796a8" transform="translate(10.08 939.932299)">minimum at n=24), TinyFish's week</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #8796a8" transform="translate(10.08 952.920153)">45/46 news and newsfetch rows, Apify</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #8796a8" transform="translate(10.08 966.199218)">(news weeks only; paid-tier price not</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #8796a8" transform="translate(10.08 979.450255)">captured) and Browserless browser (no</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #8796a8" transform="translate(10.08 992.809984)">Oct 23, 2026 browser-task run).</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #8796a8" transform="translate(10.08 1005.810826)">TinyFish is a priced provider</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #8796a8" transform="translate(10.08 1019.406395)">(TinySearch/TinyFetch free, $0.00 per</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #8796a8" transform="translate(10.08 1032.386046)">request) with no Oct 23, 2026 rows, so</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #8796a8" transform="translate(10.08 1045.52976)">it is not plotted.</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #8796a8" transform="translate(10.08 1058.757555)">Source: hazeydata/agentwebindex</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #8796a8" transform="translate(10.08 1072.042772)">data/benchmarks/latest.json @ c352ff1</text>
  </g>
