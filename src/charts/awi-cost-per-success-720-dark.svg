  <g id="text_16">
   <text style="font-weight: 600; font-size: 11px; font-family: 'Space Grotesk'; fill: #e6edf5" transform="translate(20.736 22.022028)">Exa lists cheaper than Tavily ($7.00 vs $8.00 per 1,000 calls) but costs more per</text>
   <text style="font-weight: 600; font-size: 11px; font-family: 'Space Grotesk'; fill: #e6edf5" transform="translate(20.736 38.163428)">1,000 passed checks ($17.50 vs $11.59)</text>
  </g>
  <g id="text_17">
   <text style="font-size: 9.5px; font-family: 'Inter', sans-serif; fill: #8796a8" transform="translate(20.736 55.260625)">Cost per 1,000 passed checks, at entry-tier list price (filled dots); list price per 1,000 calls (open</text>
   <text style="font-size: 9.5px; font-family: 'Inter', sans-serif; fill: #8796a8" transform="translate(20.736 66.755254)">grey). One run, 2026-10-23. Free credits don't lower it.</text>
  </g>
  <g id="text_18">
   <text style="font-size: 8px; font-family: 'Inter', sans-serif; fill: #8796a8" transform="translate(20.736 247.510273)">Passed checks exclude ToS skips (Browserless: 30 anti-bot URLs) and HTTP 429 replies (none on Oct 23); failed</text>
   <text style="font-size: 8px; font-family: 'Inter', sans-serif; fill: #8796a8" transform="translate(20.736 259.410508)">calls' cost is spread over the successes. Browserless (scrape) loads a known URL; Exa and Tavily find it.</text>
   <text style="font-size: 8px; font-family: 'Inter', sans-serif; fill: #8796a8" transform="translate(20.736 271.758242)">Different jobs, not substitutes. Volume-tier cost per 1,000 passed checks, where published: Tavily $10.87,</text>
   <text style="font-size: 8px; font-family: 'Inter', sans-serif; fill: #8796a8" transform="translate(20.736 283.857852)">Browserless $1.06. Left out: short news weeks 42/43, Apify (paid-tier price not captured) and Browserless</text>
   <text style="font-size: 8px; font-family: 'Inter', sans-serif; fill: #8796a8" transform="translate(20.736 295.996211)">browser (no Oct 23 run).</text>
   <text style="font-size: 8px; font-family: 'Inter', sans-serif; fill: #8796a8" transform="translate(20.736 307.736445)">Source: hazeydata/agentwebindex data/benchmarks/latest.json @ 6b8bd87</text>
  </g>
