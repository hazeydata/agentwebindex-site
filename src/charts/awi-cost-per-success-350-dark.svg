  <g id="text_16">
   <text style="font-weight: 600; font-size: 10px; font-family: 'Space Grotesk'; fill: #e6edf5" transform="translate(10.08 21.001844)">Exa lists cheaper than Tavily ($7.00 vs</text>
   <text style="font-weight: 600; font-size: 10px; font-family: 'Space Grotesk'; fill: #e6edf5" transform="translate(10.08 35.675844)">$8.00 per 1,000 calls) but costs more per</text>
   <text style="font-weight: 600; font-size: 10px; font-family: 'Space Grotesk'; fill: #e6edf5" transform="translate(10.08 50.349844)">1,000 passed checks ($17.50 vs $11.59)</text>
  </g>
  <g id="text_17">
   <text style="font-size: 8.5px; font-family: 'Inter', sans-serif; fill: #8796a8" transform="translate(10.08 64.383125)">Cost per 1,000 passed checks, at entry-tier list</text>
   <text style="font-size: 8.5px; font-family: 'Inter', sans-serif; fill: #8796a8" transform="translate(10.08 74.667793)">price (filled dots); list price per 1,000 calls</text>
   <text style="font-size: 8.5px; font-family: 'Inter', sans-serif; fill: #8796a8" transform="translate(10.08 84.952461)">(open grey). One run, 2026-10-23. Free credits don't</text>
   <text style="font-size: 8.5px; font-family: 'Inter', sans-serif; fill: #8796a8" transform="translate(10.08 95.237129)">lower it.</text>
  </g>
  <g id="text_18">
   <text style="font-size: 7px; font-family: 'Inter', sans-serif; fill: #8796a8" transform="translate(10.08 277.534419)">Passed checks exclude ToS skips (Browserless: 30 anti-bot</text>
   <text style="font-size: 7px; font-family: 'Inter', sans-serif; fill: #8796a8" transform="translate(10.08 288.121577)">URLs) and HTTP 429 replies (none on Oct 23); failed calls'</text>
   <text style="font-size: 7px; font-family: 'Inter', sans-serif; fill: #8796a8" transform="translate(10.08 298.547954)">cost is spread over the successes. Browserless (scrape)</text>
   <text style="font-size: 7px; font-family: 'Inter', sans-serif; fill: #8796a8" transform="translate(10.08 309.085347)">loads a known URL; Exa and Tavily find it. Different jobs,</text>
   <text style="font-size: 7px; font-family: 'Inter', sans-serif; fill: #8796a8" transform="translate(10.08 319.650083)">not substitutes. Volume-tier cost per 1,000 passed checks,</text>
   <text style="font-size: 7px; font-family: 'Inter', sans-serif; fill: #8796a8" transform="translate(10.08 330.512866)">where published: Tavily $10.87, Browserless $1.06. Left</text>
   <text style="font-size: 7px; font-family: 'Inter', sans-serif; fill: #8796a8" transform="translate(10.08 340.882915)">out: short news weeks 42/43, Apify (paid-tier price not</text>
   <text style="font-size: 7px; font-family: 'Inter', sans-serif; fill: #8796a8" transform="translate(10.08 351.483745)">captured) and Browserless browser (no Oct 23 run).</text>
   <text style="font-size: 7px; font-family: 'Inter', sans-serif; fill: #8796a8" transform="translate(10.08 361.993794)">Source: hazeydata/agentwebindex</text>
   <text style="font-size: 7px; font-family: 'Inter', sans-serif; fill: #8796a8" transform="translate(10.08 372.621968)">data/benchmarks/latest.json @ 6b8bd87</text>
  </g>
 </g>
