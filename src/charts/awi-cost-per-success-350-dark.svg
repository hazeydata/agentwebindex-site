  <g id="text_17">
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #8796a8" transform="translate(10.08 64.383125)">Cost per 1,000 passed checks, at entry-tier list</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #8796a8" transform="translate(10.08 74.667793)">price (filled dots); list price per 1,000 calls</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #8796a8" transform="translate(10.08 84.952461)">(open grey). One run, Oct 23, 2026. Free credits</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #8796a8" transform="translate(10.08 95.237129)">don't lower it.</text>
  </g>
  <g id="text_18">
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #8796a8" transform="translate(10.08 420.212909)">Passed checks exclude ToS skips</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #8796a8" transform="translate(10.08 434.034747)">(Browserless: 30 anti-bot URLs) and</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #8796a8" transform="translate(10.08 446.771039)">HTTP 429 replies (none on Oct 23,</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #8796a8" transform="translate(10.08 460.205963)">2026); failed calls' cost is spread</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #8796a8" transform="translate(10.08 473.885614)">over the successes. Browserless</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #8796a8" transform="translate(10.08 486.472882)">(scrape) loads a known URL; Exa and</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #8796a8" transform="translate(10.08 499.644623)">Tavily find it. Different jobs, not</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #8796a8" transform="translate(10.08 512.850543)">substitutes. Volume-tier cost per</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #8796a8" transform="translate(10.08 526.084491)">1,000 passed checks, where published:</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #8796a8" transform="translate(10.08 539.66297)">Tavily $10.87, Browserless $1.06.</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #8796a8" transform="translate(10.08 552.501117)">Rankings are the Oct 23, 2026 run.</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #8796a8" transform="translate(10.08 566.245709)">Left out: short news weeks 42/43/46</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #8796a8" transform="translate(10.08 579.236298)">(n=16, 40, 24; week 46 is a short</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #8796a8" transform="translate(10.08 592.671222)">week, below the minimum at n=24),</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #8796a8" transform="translate(10.08 605.516205)">TinyFish's week 45/46 news and</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #8796a8" transform="translate(10.08 618.79527)">newsfetch rows, Apify (news weeks</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #8796a8" transform="translate(10.08 632.029218)">only; paid-tier price not captured)</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #8796a8" transform="translate(10.08 645.406036)">and Browserless browser (no Oct 23,</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #8796a8" transform="translate(10.08 658.497113)">2026 browser-task run). TinyFish is a</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #8796a8" transform="translate(10.08 671.932037)">priced provider (TinySearch/TinyFetch</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #8796a8" transform="translate(10.08 685.253485)">free, $0.00 per request) with no Oct</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #8796a8" transform="translate(10.08 698.125812)">23, 2026 rows, so it is not plotted;</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #8796a8" transform="translate(10.08 711.670111)">its $0 is not a missing value.</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #8796a8" transform="translate(10.08 724.587555)">Source: hazeydata/agentwebindex</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #8796a8" transform="translate(10.08 737.872772)">data/benchmarks/latest.json @ c352ff1</text>
  </g>
