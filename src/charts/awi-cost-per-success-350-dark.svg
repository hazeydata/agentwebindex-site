  <g id="text_16">
   <text style="font-size: 9px; font-family: 'Inter', sans-serif; fill: #8796a8" transform="translate(10.08 19.51875)">Cost per 1,000 passed checks, at entry-tier</text>
   <text style="font-size: 9px; font-family: 'Inter', sans-serif; fill: #8796a8" transform="translate(10.08 30.408398)">list price (filled dots); list price per 1,000</text>
   <text style="font-size: 9px; font-family: 'Inter', sans-serif; fill: #8796a8" transform="translate(10.08 41.298047)">calls (open grey). One run, 2026-10-23. Free</text>
   <text style="font-size: 9px; font-family: 'Inter', sans-serif; fill: #8796a8" transform="translate(10.08 52.187695)">credits don't lower it.</text>
  </g>
  <g id="text_17">
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #8796a8" transform="translate(10.08 240.915441)">Passed checks exclude ToS skips (Browserless:</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #8796a8" transform="translate(10.08 253.948412)">30 anti-bot URLs) and HTTP 429 replies (none on</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #8796a8" transform="translate(10.08 267.383336)">Oct 23); failed calls' cost is spread over the</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #8796a8" transform="translate(10.08 280.416307)">successes. Browserless (scrape) loads a known</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #8796a8" transform="translate(10.08 293.588048)">URL; Exa and Tavily find it. Different jobs,</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #8796a8" transform="translate(10.08 306.793969)">not substitutes. Volume-tier cost per 1,000</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #8796a8" transform="translate(10.08 320.372448)">passed checks, where published: Tavily $10.87,</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #8796a8" transform="translate(10.08 334.050731)">Browserless $1.06. Left out: short news weeks</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #8796a8" transform="translate(10.08 346.568956)">42/43, Apify (paid-tier price not captured) and</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #8796a8" transform="translate(10.08 360.116674)">Browserless browser (no Oct 23 run).</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #8796a8" transform="translate(10.08 372.957555)">Source: hazeydata/agentwebindex</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #8796a8" transform="translate(10.08 386.242772)">data/benchmarks/latest.json @ 303efdf</text>
  </g>
