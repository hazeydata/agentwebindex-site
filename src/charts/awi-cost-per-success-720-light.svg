  <g id="text_16">
   <text style="font-size: 9.5px; font-family: 'Inter', sans-serif; fill: #999999" transform="translate(20.736 20.003125)">Cost per 1,000 passed checks, at entry-tier list price (filled dots); list price per 1,000 calls (open</text>
   <text style="font-size: 9.5px; font-family: 'Inter', sans-serif; fill: #999999" transform="translate(20.736 31.497754)">grey). One run, 2026-10-23. Free credits don't lower it.</text>
  </g>
  <g id="text_17">
   <text style="font-size: 8px; font-family: 'Inter', sans-serif; fill: #999999" transform="translate(20.736 212.252773)">Passed checks exclude ToS skips (Browserless: 30 anti-bot URLs) and HTTP 429 replies (none on Oct 23); failed</text>
   <text style="font-size: 8px; font-family: 'Inter', sans-serif; fill: #999999" transform="translate(20.736 224.153008)">calls' cost is spread over the successes. Browserless (scrape) loads a known URL; Exa and Tavily find it.</text>
   <text style="font-size: 8px; font-family: 'Inter', sans-serif; fill: #999999" transform="translate(20.736 236.500742)">Different jobs, not substitutes. Volume-tier cost per 1,000 passed checks, where published: Tavily $10.87,</text>
   <text style="font-size: 8px; font-family: 'Inter', sans-serif; fill: #999999" transform="translate(20.736 248.600352)">Browserless $1.06. Left out: short news weeks 42/43, Apify (paid-tier price not captured) and Browserless</text>
   <text style="font-size: 8px; font-family: 'Inter', sans-serif; fill: #999999" transform="translate(20.736 260.738711)">browser (no Oct 23 run).</text>
   <text style="font-size: 8px; font-family: 'Inter', sans-serif; fill: #999999" transform="translate(20.736 272.478945)">Source: hazeydata/agentwebindex data/benchmarks/latest.json @ 6b8bd87</text>
  </g>
