  <g id="text_17">
   <text style="font-size: 9.5px; font-family: 'Inter', sans-serif; fill: #999999" transform="translate(20.736 55.260625)">Cost per 1,000 passed checks, at entry-tier list price (filled dots); list price per 1,000 calls (open</text>
   <text style="font-size: 9.5px; font-family: 'Inter', sans-serif; fill: #999999" transform="translate(20.736 66.755254)">grey). One run, Oct 23, 2026. Free credits don't lower it.</text>
  </g>
  <g id="text_18">
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #999999" transform="translate(20.736 236.427284)">Passed checks exclude ToS skips (Browserless: 30 anti-bot URLs) and HTTP 429 replies (none on Oct 23, 2026);</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #999999" transform="translate(20.736 249.443165)">failed calls' cost is spread over the successes. Browserless (scrape) loads a known URL; Exa and Tavily find</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #999999" transform="translate(20.736 262.9485)">it. Different jobs, not substitutes. Volume-tier cost per 1,000 passed checks, where published: Tavily $10.87,</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #999999" transform="translate(20.736 276.148268)">Browserless $1.06. Rankings are the Oct 23, 2026 run. Left out: short news weeks 42/43/46 (n=16, 40, 24; week</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #999999" transform="translate(20.736 289.345985)">46 is a short week, below the minimum at n=24), TinyFish's week 45/46 news and newsfetch rows, Apify (news</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #999999" transform="translate(20.736 302.378956)">weeks only; paid-tier price not captured) and Browserless browser (no Oct 23, 2026 browser-task run). TinyFish</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #999999" transform="translate(20.736 315.884291)">is a priced provider (TinySearch/TinyFetch free, $0.00 per request) with no Oct 23, 2026 rows, so it is not</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #999999" transform="translate(20.736 329.084059)">plotted; its $0 is not a missing value.</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #999999" transform="translate(20.736 342.001503)">Source: hazeydata/agentwebindex data/benchmarks/latest.json @ c352ff1</text>
  </g>
 </g>
