  <g id="text_10">
   <text style="font-weight: 600; font-size: 10px; font-family: 'Space Grotesk'; fill: #333333" transform="translate(10.08 20.707312)">Tavily passed 69% of our 100 evergreen</text>
   <text style="font-weight: 600; font-size: 10px; font-family: 'Space Grotesk'; fill: #333333" transform="translate(10.08 35.381312)">checks, Exa 40%; Browserless passed 66% of</text>
   <text style="font-weight: 600; font-size: 10px; font-family: 'Space Grotesk'; fill: #333333" transform="translate(10.08 50.055312)">120 scrape checks</text>
  </g>
  <g id="text_11">
   <text style="font-size: 8.5px; font-family: 'Inter', sans-serif; fill: #999999" transform="translate(10.08 64.383125)">Pass rate on our test set (passed / attempted), with</text>
   <text style="font-size: 8.5px; font-family: 'Inter', sans-serif; fill: #999999" transform="translate(10.08 74.667793)">95% intervals. One run, 2026-10-23. Search and</text>
   <text style="font-size: 8.5px; font-family: 'Inter', sans-serif; fill: #999999" transform="translate(10.08 84.952461)">scrape are different jobs; compare within a panel. A</text>
   <text style="font-size: 8.5px; font-family: 'Inter', sans-serif; fill: #999999" transform="translate(10.08 95.237129)">search pass = the expected URL in the top 10, the</text>
   <text style="font-size: 8.5px; font-family: 'Inter', sans-serif; fill: #999999" transform="translate(10.08 105.521797)">expected domain in the top 5, or the expected text</text>
   <text style="font-size: 8.5px; font-family: 'Inter', sans-serif; fill: #999999" transform="translate(10.08 115.806465)">in a top-5 result.</text>
  </g>
  <g id="text_12">
   <text style="font-weight: 600; font-size: 8.5px; font-family: 'Inter', sans-serif; text-anchor: start; fill: #333333" x="10.08" y="151.130791" transform="rotate(-0 10.08 151.130791)">Search APIs · 100 evergreen questions</text>
  </g>
  <g id="text_13">
   <text style="font-size: 7.5px; font-family: 'Inter', sans-serif; fill: #999999" transform="translate(10.08 216.049512)">Not tested: Brave (terms forbid benchmarking), Linkup (not</text>
   <text style="font-size: 7.5px; font-family: 'Inter', sans-serif; fill: #999999" transform="translate(10.08 227.155371)">in month 1), Parallel (not in month 1), Serper (not in</text>
   <text style="font-size: 7.5px; font-family: 'Inter', sans-serif; fill: #999999" transform="translate(10.08 238.471582)">month 1)</text>
  </g>
  <g id="text_14">
   <text style="font-weight: 600; font-size: 8.5px; font-family: 'Inter', sans-serif; text-anchor: start; fill: #333333" x="10.08" y="265.352041" transform="rotate(-0 10.08 265.352041)">Scrape APIs · URL set</text>
  </g>
  <g id="text_15">
   <text style="font-size: 7.5px; font-family: 'Inter', sans-serif; fill: #999999" transform="translate(10.08 335.354707)">30 skipped under Browserless's terms (anti-bot URLs;</text>
   <text style="font-size: 7.5px; font-family: 'Inter', sans-serif; fill: #999999" transform="translate(10.08 346.244355)">skips, not failures). Not tested: Exa (not built),</text>
   <text style="font-size: 7.5px; font-family: 'Inter', sans-serif; fill: #999999" transform="translate(10.08 357.291621)">Parallel (not in month 1), Firecrawl (no key), Jina (not</text>
   <text style="font-size: 7.5px; font-family: 'Inter', sans-serif; fill: #999999" transform="translate(10.08 368.18127)">in month 1), Apify (not built), Hyperbrowser (not in month</text>
   <text style="font-size: 7.5px; font-family: 'Inter', sans-serif; fill: #999999" transform="translate(10.08 379.041621)">1), ScrapingBee (not in month 1), Bright Data (not run</text>
   <text style="font-size: 7.5px; font-family: 'Inter', sans-serif; fill: #999999" transform="translate(10.08 389.788301)">yet)</text>
  </g>
  <g id="text_16">
   <text style="font-weight: 600; font-size: 8.5px; font-family: 'Inter', sans-serif; text-anchor: start; fill: #333333" x="10.08" y="413.874541" transform="rotate(-0 10.08 413.874541)">Browser APIs</text>
  </g>
  <g id="text_17">
   <text style="font-size: 7.5px; font-family: 'Inter', sans-serif; fill: #999999" transform="translate(10.08 439.196309)">No browser run on Oct 23: the browser-task set file was</text>
   <text style="font-size: 7.5px; font-family: 'Inter', sans-serif; fill: #999999" transform="translate(10.08 449.36291)">missing at run time. Not tested: Hyperbrowser (not in</text>
   <text style="font-size: 7.5px; font-family: 'Inter', sans-serif; fill: #999999" transform="translate(10.08 460.576582)">month 1), Browserbase (not in month 1), Steel (not in</text>
   <text style="font-size: 7.5px; font-family: 'Inter', sans-serif; fill: #999999" transform="translate(10.08 471.78498)">month 1)</text>
  </g>
  <g id="text_18">
   <text style="font-size: 7px; font-family: 'Inter', sans-serif; fill: #999999" transform="translate(10.08 491.549526)">Denominator = queries or URLs we graded: excludes ToS</text>
   <text style="font-size: 7px; font-family: 'Inter', sans-serif; fill: #999999" transform="translate(10.08 502.208872)">skips and HTTP 429 rate-limit replies (none logged on Oct</text>
   <text style="font-size: 7px; font-family: 'Inter', sans-serif; fill: #999999" transform="translate(10.08 512.956812)">23). Search graded with canon-2026-10-20; scrape pass/fail</text>
   <text style="font-size: 7px; font-family: 'Inter', sans-serif; fill: #999999" transform="translate(10.08 523.383188)">from the run log (grader 'run-log'). Scrape set: 150 URLs;</text>
   <text style="font-size: 7px; font-family: 'Inter', sans-serif; fill: #999999" transform="translate(10.08 534.075894)">Browserless's terms forbid the 30 anti-bot ones, so 120</text>
   <text style="font-size: 7px; font-family: 'Inter', sans-serif; fill: #999999" transform="translate(10.08 544.562427)">were tested. No row is mock or partial. Left out on</text>
   <text style="font-size: 7px; font-family: 'Inter', sans-serif; fill: #999999" transform="translate(10.08 555.185679)">purpose: the short news weeks 42 and 43 (n=16 and 40,</text>
   <text style="font-size: 7px; font-family: 'Inter', sans-serif; fill: #999999" transform="translate(10.08 565.731821)">flagged), Apify (news weeks only) and Browserless browser</text>
   <text style="font-size: 7px; font-family: 'Inter', sans-serif; fill: #999999" transform="translate(10.08 576.597339)">(no Oct 23 run).</text>
   <text style="font-size: 7px; font-family: 'Inter', sans-serif; fill: #999999" transform="translate(10.08 586.870044)">Source: hazeydata/agentwebindex</text>
   <text style="font-size: 7px; font-family: 'Inter', sans-serif; fill: #999999" transform="translate(10.08 597.498218)">data/benchmarks/latest.json @ 6b8bd87</text>
  </g>
