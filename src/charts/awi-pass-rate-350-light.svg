  <g id="text_10">
   <text style="font-size: 9px; font-family: 'Inter', sans-serif; fill: #999999" transform="translate(10.08 19.51875)">Pass rate on our test set (passed / attempted),</text>
   <text style="font-size: 9px; font-family: 'Inter', sans-serif; fill: #999999" transform="translate(10.08 30.408398)">with 95% intervals. One run, 2026-10-23. Search</text>
   <text style="font-size: 9px; font-family: 'Inter', sans-serif; fill: #999999" transform="translate(10.08 41.298047)">and scrape are different jobs; compare within a</text>
   <text style="font-size: 9px; font-family: 'Inter', sans-serif; fill: #999999" transform="translate(10.08 52.187695)">panel. A search pass = the expected URL in the</text>
   <text style="font-size: 9px; font-family: 'Inter', sans-serif; fill: #999999" transform="translate(10.08 63.077344)">top 10, the expected domain in the top 5, or</text>
   <text style="font-size: 9px; font-family: 'Inter', sans-serif; fill: #999999" transform="translate(10.08 73.966992)">the expected text in a top-5 result.</text>
  </g>
  <g id="text_11">
   <text style="font-weight: 600; font-size: 9px; font-family: 'Inter', sans-serif; text-anchor: start; fill: #333333" x="10.08" y="110.013926" transform="rotate(-0 10.08 110.013926)">Search APIs · 100 evergreen questions</text>
  </g>
  <g id="text_12">
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #999999" transform="translate(10.08 176.005889)">Not tested: Brave (terms forbid benchmarking),</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #999999" transform="translate(10.08 188.962725)">Linkup (not in month 1), Parallel (not in month</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #999999" transform="translate(10.08 201.667314)">1), Serper (not in month 1)</text>
  </g>
  <g id="text_13">
   <text style="font-weight: 600; font-size: 9px; font-family: 'Inter', sans-serif; text-anchor: start; fill: #333333" x="10.08" y="229.601426" transform="rotate(-0 10.08 229.601426)">Scrape APIs · URL set</text>
  </g>
  <g id="text_14">
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #999999" transform="translate(10.08 300.684658)">30 skipped under Browserless's terms (anti-bot</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #999999" transform="translate(10.08 313.389248)">URLs; skips, not failures). Not tested: Exa</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #999999" transform="translate(10.08 326.420596)">(not built), Parallel (not in month 1),</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #999999" transform="translate(10.08 338.982314)">Firecrawl (no key), Jina (not in month 1),</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #999999" transform="translate(10.08 351.485928)">Apify (not built), Hyperbrowser (not in month</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #999999" transform="translate(10.08 364.357314)">1), ScrapingBee (not in month 1), Bright Data</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #999999" transform="translate(10.08 376.895107)">(not run yet)</text>
  </g>
  <g id="text_15">
   <text style="font-weight: 600; font-size: 9px; font-family: 'Inter', sans-serif; text-anchor: start; fill: #333333" x="10.08" y="400.398926" transform="rotate(-0 10.08 400.398926)">Browser APIs</text>
  </g>
  <g id="text_16">
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #999999" transform="translate(10.08 426.807803)">No browser run on Oct 23: the browser-task set</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #999999" transform="translate(10.08 438.730361)">file was missing at run time. Not tested:</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #999999" transform="translate(10.08 451.715225)">Hyperbrowser (not in month 1), Browserbase (not</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #999999" transform="translate(10.08 464.562686)">in month 1), Steel (not in month 1)</text>
  </g>
  <g id="text_17">
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #999999" transform="translate(10.08 491.399012)">Denominator = queries or URLs we graded:</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #999999" transform="translate(10.08 504.68423)">excludes ToS skips and HTTP 429 rate-limit</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #999999" transform="translate(10.08 518.158119)">replies (none logged on Oct 23). Search graded</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #999999" transform="translate(10.08 531.197242)">with canon-2026-10-20; scrape pass/fail from</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #999999" transform="translate(10.08 544.425038)">the run log (grader 'run-log'). Scrape set: 150</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #999999" transform="translate(10.08 557.790919)">URLs; Browserless's terms forbid the 30</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #999999" transform="translate(10.08 570.97975)">anti-bot ones, so 120 were tested. No row is</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #999999" transform="translate(10.08 584.133033)">mock or partial. Left out on purpose: the short</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #999999" transform="translate(10.08 597.360829)">news weeks 42 and 43 (n=16 and 40, flagged),</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #999999" transform="translate(10.08 610.628956)">Apify (news weeks only) and Browserless browser</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #999999" transform="translate(10.08 624.176674)">(no Oct 23 run).</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #999999" transform="translate(10.08 637.017555)">Source: hazeydata/agentwebindex</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #999999" transform="translate(10.08 650.302772)">data/benchmarks/latest.json @ 303efdf</text>
  </g>
