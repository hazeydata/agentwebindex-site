  <g id="text_10">
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #999999" transform="translate(10.08 19.276563)">Pass rate on our test set (passed / attempted), with</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #999999" transform="translate(10.08 29.863721)">95% intervals. One run, Oct 23, 2026. Search and</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #999999" transform="translate(10.08 40.450879)">scrape are different jobs; compare within a panel. A</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #999999" transform="translate(10.08 51.038037)">search pass = the expected URL in the top 10, the</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #999999" transform="translate(10.08 61.625195)">expected domain in the top 5, or the expected text</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #999999" transform="translate(10.08 72.212354)">in a top-5 result.</text>
  </g>
  <g id="text_11">
   <text style="font-weight: 600; font-size: 8.75px; font-family: 'Inter', sans-serif; text-anchor: start; fill: #333333" x="10.08" y="107.897983" transform="rotate(-0 10.08 107.897983)">Search APIs · 100 evergreen questions</text>
  </g>
  <g id="text_12">
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #999999" transform="translate(10.08 174.328838)">Not tested: Brave (terms forbid</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #999999" transform="translate(10.08 186.685479)">benchmarking), Linkup (not in month</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #999999" transform="translate(10.08 199.642314)">1), Parallel (not in month 1), Serper</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #999999" transform="translate(10.08 212.643584)">(not in month 1)</text>
  </g>
  <g id="text_13">
   <text style="font-weight: 600; font-size: 8.75px; font-family: 'Inter', sans-serif; text-anchor: start; fill: #333333" x="10.08" y="273.205483" transform="rotate(-0 10.08 273.205483)">Scrape APIs · URL set</text>
  </g>
  <g id="text_14">
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #999999" transform="translate(10.08 344.379658)">30 ToS skips on anti-bot URLs (skips,</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #999999" transform="translate(10.08 357.032979)">not failures; not graded). Not tested:</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #999999" transform="translate(10.08 369.914619)">Exa (not built), Parallel (not in</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #999999" transform="translate(10.08 382.677314)">month 1), Firecrawl (no key), Jina</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #999999" transform="translate(10.08 395.381904)">(not in month 1), Apify (not built),</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #999999" transform="translate(10.08 408.086494)">Hyperbrowser (not in month 1),</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #999999" transform="translate(10.08 420.756904)">ScrapingBee (not in month 1), Bright</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #999999" transform="translate(10.08 433.512764)">Data (Nov 2, 2026 run; not plotted)</text>
  </g>
  <g id="text_15">
   <text style="font-weight: 600; font-size: 8.75px; font-family: 'Inter', sans-serif; text-anchor: start; fill: #333333" x="10.08" y="507.340483" transform="rotate(-0 10.08 507.340483)">Browser APIs</text>
  </g>
  <g id="text_16">
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #999999" transform="translate(10.08 533.128682)">No browser run on Oct 23, 2026: the</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #999999" transform="translate(10.08 545.762861)">browser-task set file was missing at</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #999999" transform="translate(10.08 558.456514)">run time. Not tested: Hyperbrowser</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #999999" transform="translate(10.08 571.595186)">(not in month 1), Browserbase (not in</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #999999" transform="translate(10.08 584.299775)">month 1), Steel (not in month 1)</text>
  </g>
  <g id="text_17">
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #999999" transform="translate(10.08 734.83495)">Denominator = queries or URLs we</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #999999" transform="translate(10.08 748.017628)">graded: excludes ToS skips and HTTP</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #999999" transform="translate(10.08 761.34181)">429 rate-limit replies (none logged on</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #999999" transform="translate(10.08 774.776735)">Oct 23, 2026). Search graded with</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #999999" transform="translate(10.08 787.815858)">canon-2026-10-20; scrape pass/fail</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #999999" transform="translate(10.08 801.043654)">from the run log (grader 'run-log').</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #999999" transform="translate(10.08 814.177113)">Scrape set: 150 URLs; Browserless's</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #999999" transform="translate(10.08 827.643483)">terms forbid the 30 anti-bot ones, so</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #999999" transform="translate(10.08 841.548036)">120 were tested. No row is mock or</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #999999" transform="translate(10.08 853.94048)">partial. Plotted: the Oct 23, 2026</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #999999" transform="translate(10.08 867.59142)">run. Week 47 (Nov 16, 2026) results</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #999999" transform="translate(10.08 880.534156)">are in the Week 47 table, not here;</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #999999" transform="translate(10.08 893.715468)">its news set (n=20) and Apify search</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #999999" transform="translate(10.08 906.915236)">(n=9) are below the minimum. Bright</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #999999" transform="translate(10.08 920.401429)">Data (Nov 2, 2026 run) is not plotted.</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #999999" transform="translate(10.08 933.417311)">Apify and TinyFish (priced;</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #999999" transform="translate(10.08 946.922645)">TinySearch/TinyFetch free, $0.00 per</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #999999" transform="translate(10.08 959.902296)">request) have no Oct 23, 2026 rows, so</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #999999" transform="translate(10.08 972.92433)">they are not plotted.</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #999999" transform="translate(10.08 986.273805)">Source: hazeydata/agentwebindex</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #999999" transform="translate(10.08 999.559022)">data/benchmarks/latest.json @ 7fdefab</text>
  </g>
