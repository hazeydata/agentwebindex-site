  <g id="text_16">
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #999999" transform="translate(10.08 19.276562)">Cost per 1,000 passed checks, at entry-tier list</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #999999" transform="translate(10.08 29.863721)">price (filled dots); list price per 1,000 calls</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #999999" transform="translate(10.08 40.450879)">(open grey). One run, Oct 23, 2026. Free credits</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #999999" transform="translate(10.08 51.038037)">don't lower it.</text>
  </g>
  <g id="text_17">
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #999999" transform="translate(10.08 382.178929)">Passed checks exclude ToS skips</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #999999" transform="translate(10.08 396.000768)">(Browserless: 30 anti-bot URLs) and</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #999999" transform="translate(10.08 408.737059)">HTTP 429 replies (none on Oct 23,</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #999999" transform="translate(10.08 422.171984)">2026); failed calls' cost is spread</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #999999" transform="translate(10.08 435.851635)">over the successes. Browserless</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #999999" transform="translate(10.08 448.438903)">(scrape) loads a known URL; Exa and</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #999999" transform="translate(10.08 461.610643)">Tavily find it. Different jobs, not</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #999999" transform="translate(10.08 474.816564)">substitutes. Volume-tier cost per</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #999999" transform="translate(10.08 488.050511)">1,000 passed checks, where published:</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #999999" transform="translate(10.08 501.62899)">Tavily $10.87, Browserless $1.06.</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #999999" transform="translate(10.08 514.582665)">Plotted: the Oct 23, 2026 run. Week 47</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #999999" transform="translate(10.08 528.169347)">(Nov 16, 2026) results are in the Week</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #999999" transform="translate(10.08 541.112084)">47 table, not here; its news set</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #999999" transform="translate(10.08 554.293395)">(n=20) and Apify search (n=9) are</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #999999" transform="translate(10.08 567.694139)">below the minimum. Bright Data (Nov 2,</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #999999" transform="translate(10.08 580.76129)">2026 run) is not plotted. Apify and</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #999999" transform="translate(10.08 593.995238)">TinyFish (priced; TinySearch/TinyFetch</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #999999" transform="translate(10.08 607.517662)">free, $0.00 per request) have no Oct</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #999999" transform="translate(10.08 620.311376)">23, 2026 rows, so they are not</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #999999" transform="translate(10.08 633.968468)">plotted; TinyFish's $0 is not a</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #999999" transform="translate(10.08 646.806615)">missing value.</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #999999" transform="translate(10.08 660.08568)">Source: hazeydata/agentwebindex</text>
   <text style="font-size: 8.75px; font-family: 'Inter', sans-serif; fill: #999999" transform="translate(10.08 673.370897)">data/benchmarks/latest.json @ 7fdefab</text>
