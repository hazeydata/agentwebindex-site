  <g id="text_16">
   <text style="font-size: 8.5px; font-family: 'Inter', sans-serif; fill: #999999" transform="translate(10.08 19.034375)">Cost per 1,000 passed checks, at entry-tier list</text>
   <text style="font-size: 8.5px; font-family: 'Inter', sans-serif; fill: #999999" transform="translate(10.08 29.319043)">price (filled dots); list price per 1,000 calls</text>
   <text style="font-size: 8.5px; font-family: 'Inter', sans-serif; fill: #999999" transform="translate(10.08 39.603711)">(open grey). One run, 2026-10-23. Free credits don't</text>
   <text style="font-size: 8.5px; font-family: 'Inter', sans-serif; fill: #999999" transform="translate(10.08 49.888379)">lower it.</text>
  </g>
  <g id="text_17">
   <text style="font-size: 8px; font-family: 'Inter', sans-serif; fill: #999999" transform="translate(10.08 242.120117)">Passed checks exclude ToS skips (Browserless: 30</text>
   <text style="font-size: 8px; font-family: 'Inter', sans-serif; fill: #999999" transform="translate(10.08 254.035977)">anti-bot URLs) and HTTP 429 replies (none on Oct</text>
   <text style="font-size: 8px; font-family: 'Inter', sans-serif; fill: #999999" transform="translate(10.08 266.319336)">23); failed calls' cost is spread over the</text>
   <text style="font-size: 8px; font-family: 'Inter', sans-serif; fill: #999999" transform="translate(10.08 278.235195)">successes. Browserless (scrape) loads a known URL;</text>
   <text style="font-size: 8px; font-family: 'Inter', sans-serif; fill: #999999" transform="translate(10.08 290.27793)">Exa and Tavily find it. Different jobs, not</text>
   <text style="font-size: 8px; font-family: 'Inter', sans-serif; fill: #999999" transform="translate(10.08 302.351914)">substitutes. Volume-tier cost per 1,000 passed</text>
   <text style="font-size: 8px; font-family: 'Inter', sans-serif; fill: #999999" transform="translate(10.08 314.766523)">checks, where published: Tavily $10.87, Browserless</text>
   <text style="font-size: 8px; font-family: 'Inter', sans-serif; fill: #999999" transform="translate(10.08 326.866133)">$1.06. Left out: short news weeks 42/43, Apify</text>
   <text style="font-size: 8px; font-family: 'Inter', sans-serif; fill: #999999" transform="translate(10.08 338.733242)">(paid-tier price not captured) and Browserless</text>
   <text style="font-size: 8px; font-family: 'Inter', sans-serif; fill: #999999" transform="translate(10.08 351.104102)">browser (no Oct 23 run).</text>
   <text style="font-size: 8px; font-family: 'Inter', sans-serif; fill: #999999" transform="translate(10.08 362.844336)">Source: hazeydata/agentwebindex</text>
   <text style="font-size: 8px; font-family: 'Inter', sans-serif; fill: #999999" transform="translate(10.08 374.99082)">data/benchmarks/latest.json @ 6b8bd87</text>
  </g>
