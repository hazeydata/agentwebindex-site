  <g id="text_12">
   <text style="font-size: 9.5px; font-family: 'Inter', sans-serif; fill: #999999" transform="translate(20.736 20.003125)">Pass rate on our test set (passed / attempted), with 95% intervals. One run, 2026-10-23. Search and</text>
   <text style="font-size: 9.5px; font-family: 'Inter', sans-serif; fill: #999999" transform="translate(20.736 31.497754)">scrape are different jobs; compare within a panel. A search pass = the expected URL in the top 10, the</text>
   <text style="font-size: 9.5px; font-family: 'Inter', sans-serif; fill: #999999" transform="translate(20.736 42.992383)">expected domain in the top 5, or the expected text in a top-5 result.</text>
  </g>
  <g id="text_13">
   <text style="font-weight: 600; font-size: 9.5px; font-family: 'Inter', sans-serif; text-anchor: start; fill: #333333" x="20.736" y="75.770811" transform="rotate(-0 20.736 75.770811)">Search APIs · 100 evergreen questions</text>
  </g>
  <g id="text_14">
   <text style="font-size: 8.5px; font-family: 'Inter', sans-serif; fill: #999999" transform="translate(20.736 141.525098)">Not tested: Brave (terms forbid benchmarking), Linkup (not in month 1), Parallel (not in month 1), Serper (not</text>
   <text style="font-size: 8.5px; font-family: 'Inter', sans-serif; fill: #999999" transform="translate(20.736 154.399941)">in month 1)</text>
  </g>
  <g id="text_15">
   <text style="font-weight: 600; font-size: 9.5px; font-family: 'Inter', sans-serif; text-anchor: start; fill: #333333" x="20.736" y="182.533311" transform="rotate(-0 20.736 182.533311)">Scrape APIs · URL set</text>
  </g>
  <g id="text_16">
   <text style="font-size: 8.5px; font-family: 'Inter', sans-serif; fill: #999999" transform="translate(20.736 253.182168)">30 skipped under Browserless's terms (anti-bot URLs; skips, not failures). Not tested: Exa (not built),</text>
   <text style="font-size: 8.5px; font-family: 'Inter', sans-serif; fill: #999999" transform="translate(20.736 265.702402)">Parallel (not in month 1), Firecrawl (no key), Jina (not in month 1), Apify (not built), Hyperbrowser (not in</text>
   <text style="font-size: 8.5px; font-family: 'Inter', sans-serif; fill: #999999" transform="translate(20.736 278.010801)">month 1), ScrapingBee (not in month 1), Bright Data (not run yet)</text>
  </g>
  <g id="text_17">
   <text style="font-weight: 600; font-size: 9.5px; font-family: 'Inter', sans-serif; text-anchor: start; fill: #333333" x="20.736" y="305.237061" transform="rotate(-0 20.736 305.237061)">Browser APIs</text>
  </g>
  <g id="text_18">
   <text style="font-size: 8.5px; font-family: 'Inter', sans-serif; fill: #999999" transform="translate(20.736 330.476113)">No browser run on Oct 23: the browser-task set file was missing at run time. Not tested: Hyperbrowser (not in</text>
   <text style="font-size: 8.5px; font-family: 'Inter', sans-serif; fill: #999999" transform="translate(20.736 343.184941)">month 1), Browserbase (not in month 1), Steel (not in month 1)</text>
  </g>
  <g id="text_19">
   <text style="font-size: 8px; font-family: 'Inter', sans-serif; fill: #999999" transform="translate(20.736 365.955898)">Denominator = queries or URLs we graded: excludes ToS skips and HTTP 429 rate-limit replies (none logged on</text>
   <text style="font-size: 8px; font-family: 'Inter', sans-serif; fill: #999999" transform="translate(20.736 378.239258)">Oct 23). Search graded with canon-2026-10-20; scrape pass/fail from the run log (grader 'run-log'). Scrape</text>
   <text style="font-size: 8px; font-family: 'Inter', sans-serif; fill: #999999" transform="translate(20.736 390.160742)">set: 150 URLs; Browserless's terms forbid the 30 anti-bot ones, so 120 were tested. No row is mock or partial.</text>
   <text style="font-size: 8px; font-family: 'Inter', sans-serif; fill: #999999" transform="translate(20.736 402.254727)">Left out on purpose: the short news weeks 42 and 43 (n=16 and 40, flagged), Apify (news weeks only) and</text>
   <text style="font-size: 8px; font-family: 'Inter', sans-serif; fill: #999999" transform="translate(20.736 414.672461)">Browserless browser (no Oct 23 run).</text>
   <text style="font-size: 8px; font-family: 'Inter', sans-serif; fill: #999999" transform="translate(20.736 426.412695)">Source: hazeydata/agentwebindex data/benchmarks/latest.json @ 6b8bd87</text>
  </g>
